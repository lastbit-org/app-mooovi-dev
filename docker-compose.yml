services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: app-mooovi-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
      secrets:
        - firebase_api_key
        - firebase_auth_domain
        - firebase_project_id
        - firebase_storage_bucket
        - firebase_messaging_sender_id
        - firebase_app_id
    image: app-mooovi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

secrets:
  firebase_api_key:
    environment: VITE_FIREBASE_API_KEY
  firebase_auth_domain:
    environment: VITE_FIREBASE_AUTH_DOMAIN
  firebase_project_id:
    environment: VITE_FIREBASE_PROJECT_ID
  firebase_storage_bucket:
    environment: VITE_FIREBASE_STORAGE_BUCKET
  firebase_messaging_sender_id:
    environment: VITE_FIREBASE_MESSAGING_SENDER_ID
  firebase_app_id:
    environment: VITE_FIREBASE_APP_ID
